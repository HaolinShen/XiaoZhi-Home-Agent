# ============================================================
# 智能家居家电互联智能体 — 项目元数据
# ============================================================
[project]
name = "smart-home-agent"
version = "0.1.0"
description = "基于 LangGraph + MCP + 阿里百炼的智能家居 AI Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name", email = "your@email.com" }]
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph-checkpoint>=4.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # P4 工程卫生: lint / typecheck 工具（安装需用户明确许可，配置先行）
    "ruff>=0.9.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================
# P4 工程卫生: lint / typecheck 配置
# ============================================================
# 以前项目没有任何 lint/format/typecheck 配置，"漏改一处同步点"全靠人肉。
# ruff 能抓住未使用导入、未定义名等低级错误；mypy 抓类型层面的失配。
# 使用方式（首次需安装 dev extras）:
#   pip install -e ".[dev]"
#   ruff check src tests
#   mypy src
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes（未使用导入、未定义名）
    "W",    # pycodestyle warnings
    "I",    # isort 导入排序
    "UP",   # pyupgrade 语法现代化
]
# 与既有代码风格保持一致，不做过度约束。
ignore = [
    "E501",  # 行宽交由 line-length + 格式化处理，避免噪声
]

[tool.mypy]
python_version = "3.11"
# 渐进式类型：先不加 strict，避免一次性淹没在存量标注缺口里。
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["tests/"]
